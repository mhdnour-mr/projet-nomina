services:
  - type: web
    name: nomina-forms
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /data
    disks:
      - name: nomina-data
        mountPath: /data
        sizeGB: 1
